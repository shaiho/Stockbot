# Before enabling, make sure the port is free:  sudo ss -ltnp | grep 18765   (no output = free)
# No HTTPS available: bind to localhost only and reach the site through an SSH tunnel:
#   ssh -L 18765:127.0.0.1:18765 user@vps   ->   http://localhost:18765
# To expose publicly instead, change both 127.0.0.1 below to * and uncomment the Require ip line
# (an IP allowlist limits who can try the login, but the password still travels unencrypted).
Listen 127.0.0.1:18765

<VirtualHost 127.0.0.1:18765>
    DocumentRoot /opt/stockbot/web/public
    DirectoryIndex index.php

    <Directory /opt/stockbot/web/public>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
        # Require ip 203.0.113.10
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/stockbot-web-error.log
    CustomLog ${APACHE_LOG_DIR}/stockbot-web-access.log combined
</VirtualHost>
